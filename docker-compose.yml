services:
  whisper-station:
    image: whisper-final:v1 # 给构建出来的镜像起个名字
    container_name: whisper_offline
    volumes:
      - .:/app
      - ~/.cache:/root/.cache
      - ./output:/app/output
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir: /app
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_ENDPOINT=https://hf-mirror.com
      - TZ=Asia/Shanghai
    tty: true
    stdin_open: true
    # ✅ 启动命令简化为 tail，保持容器后台存活即可
    command: tail -f /dev/null